# ---------------------------------------------------------------------------
# Toronto Hydro-Electric System Limited — Residential Service (RPP)
# Rates verified 2026-11-10 against:
#   https://www.torontohydro.com/for-home/rates
#   https://www.oeb.ca/consumer-information-and-protection/electricity-rates/historical-electricity-rates
#   Toronto Hydro 2026 Tariff of Rates and Charges (EB-2025-0006)
#
# HOW TO KEEP THIS CURRENT
#   * Commodity (electricity) prices change every November 1.
#   * Delivery charges change every January 1.
#   * The Ontario Electricity Rebate (OER) can change at any time.
#   * Tier thresholds change May 1 (summer) and November 1 (winter).
# Add a new [[commodity]] / [[delivery]] / [[regulatory]] / [[rebate]] block
# with a later effective_from date. Never edit history: statements already
# issued must stay reproducible.
#
# All rates are dollars per kWh unless noted. Fixed monthly charges are kept
# here for transparency but are deliberately excluded from EV billing: they do
# not change when you plug in a car.
# ---------------------------------------------------------------------------

currency = "CAD"
timezone = "America/Toronto"
hst = 0.13

# Toronto Hydro "Total Loss Factor - Secondary Metered Customer < 5,000 kW".
# Delivery and regulatory charges are billed on metered kWh x loss factor.
# Confirmed on the utility's own sample bill: 700 kWh metered -> 720.65 kWh
# adjusted (720.65 / 700 = 1.0295).
[[loss_factor]]
effective_from = 2025-01-01
value = 1.0295
source = "Toronto Hydro 2026 Tariff of Rates and Charges, EB-2025-0006"

[[loss_factor]]
effective_from = 2026-01-01
value = 1.0295
source = "Toronto Hydro 2026 Tariff (EB-2025-0006); 700 kWh -> 720.65 kWh on sample bill"

